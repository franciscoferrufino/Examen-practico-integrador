# ==============================================================================
# CONFIGURACIÓN PRINCIPAL DE SPRING BOOT - SISTEMA TECNO-UAM
# Los secretos se leen desde variables de entorno del sistema o archivo .env local
# ==============================================================================

spring.application.name=tecnouam-prestamos-api
spring.config.import=optional:file:.env[.properties],optional:file:./backend/.env[.properties],optional:file:../.env[.properties]

# Puerto HTTP
server.port=${SERVER_PORT:8080}

# Conexión a Base de Datos Relacional Microsoft SQL Server
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=TecnoUAM;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:tecnouam_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuración JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Seguridad JWT (sin valores sensibles quemados en el repositorio)
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# Orígenes permitidos para CORS (Frontend React)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Cuentas iniciales reproducibles (administrador y usuario de consulta)
app.seed.admin-username=${APP_ADMIN_USERNAME:admin}
app.seed.admin-password=${APP_ADMIN_PASSWORD}
app.seed.user-username=${APP_USER_USERNAME:user}
app.seed.user-password=${APP_USER_PASSWORD}
